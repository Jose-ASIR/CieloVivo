name: Diagnostico APIs
on:
  push:
    paths: ['.github/workflows/diagnostico.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          exec > out.txt 2>&1
          for u in "https://opendata.adsb.fi/api/v2/lat/37.18/lon/-3.6/dist/100" "https://opendata.adsb.fi/api/v3/lat/37.18/lon/-3.6/dist/100" "https://api.adsb.one/v2/point/37.18/-3.6/100" "https://api.adsb.lol/v2/lat/37.18/lon/-3.6/dist/100"; do
            echo "===== $u"
            curl -sS -m 20 -A "GlobalAir-Android/1.0" -o body.json -w "HTTP %{http_code}\n" "$u"
            head -c 300 body.json; echo
            sleep 2
          done
          echo "===== adsb.lol rafaga 1 req/s"
          for i in $(seq 1 15); do curl -sS -m 20 -A "GlobalAir-Android/1.0" -o /dev/null -w "%{http_code} %{time_total}s\n" "https://api.adsb.lol/v2/point/37.18/-3.6/100"; sleep 1; done
          echo "===== adsb.lol rafaga sin pausa"
          for i in $(seq 1 10); do curl -sS -m 20 -A "GlobalAir-Android/1.0" -o /dev/null -w "%{http_code} %{time_total}s\n" "https://api.adsb.lol/v2/point/37.18/-3.6/250"; done
      - if: always()
        run: |
          mkdir r && mv out.txt r/ && cd r
          git init -q -b diagnostico && git add out.txt
          git -c user.name=ci -c user.email=ci@x commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diagnostico
